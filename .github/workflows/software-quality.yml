name: Web Software Quality Metrics

on:
  push:

permissions:
  contents: read

jobs:
  quality-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci --include=dev

      - name: Run Quality Metrics
        id: metrics
        shell: bash
        run: |
          set +e
          overall_status=0

          echo "========================================="
          echo " 1) RUNNING LINTER (ESLint)              "
          echo "========================================="
          # Ejecuta el linter sobre los componentes de Next.js
          npm run lint > eslint.log 2>&1
          eslint_exit=$?
          
          if [ "$eslint_exit" -eq 0 ]; then
            echo "✅ Lint check passed!"
            eslint_status="pass"
          else
            echo "❌ Lint check failed! See errors below:"
            cat eslint.log
            eslint_status="fail"
            overall_status=1
          fi

          echo -e "\n========================================="
          echo " 2) RUNNING CODE DUPLICATION (jscpd)     "
          echo "========================================="
          # Analiza la duplicación en carpetas clave (app, components, etc.) sin requerir instalación global
          npx jscpd app/ components/ lib/ --min-lines 5 --min-tokens 40 > jscpd.log 2>&1
          jscpd_exit=$?
          
          # jscpd devuelve 0 si no hay duplicación excesiva, o >0 si supera el umbral básico
          if [ "$jscpd_exit" -eq 0 ]; then
            echo "✅ No significant code duplication found."
            duplication_status="pass"
          else
            echo "⚠️ Potential code duplication detected or directories missing:"
            cat jscpd.log
            duplication_status="warning"
          fi

          echo -e "\n========================================="
          echo " 3) RUNNING SECURITY AUDIT (npm audit)  "
          echo "========================================="
          # Analiza vulnerabilidades conocidas en tus dependencias de npm
          npm audit --audit-level=high > audit.log 2>&1
          audit_exit=$?
          
          if [ "$audit_exit" -eq 0 ]; then
            echo "✅ No high or critical vulnerabilities found found found found."
            security_status="pass"
          else
            echo "❌ High/Critical security vulnerabilities detected in packages:"
            cat audit.log
            security_status="fail"
            overall_status=1
          fi

          # Registrar outputs en GitHub Actions por si necesitas utilizarlos en otros jobs
          {
            echo "lint=$eslint_status"
            echo "duplication=$duplication_status"
            echo "security=$security_status"
          } >> "$GITHUB_OUTPUT"

          # Si quieres que la acción de GitHub marque el Push en ROJO si el linter o seguridad fallan:
          # exit $overall_status
          
          # De momento lo dejamos en 0 para que sea puramente informativo como el tuyo original
          exit 0